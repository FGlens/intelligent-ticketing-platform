{% extends "base.html" %}

{% block title %}Register - Intelligent Ticketing Platform{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Create Account</h2>
    <form method="POST">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="role">I am a...</label>
            <select id="role" name="role">
                <option value="user">Regular User (Buy Tickets)</option>
                <option value="organizer">Event Organizer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="preferred_categories">Preferred Categories (optional)</label>
            <input type="text" id="preferred_categories" name="preferred_categories" 
                   placeholder="e.g. Music, Sports, Technology">
            <small>Separate with commas</small>
        </div>
        <button type="submit" class="btn-primary">Register</button>
    </form>
    <p style="text-align:center; margin-top:20px;">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
    </p>
</div>
{% endblock %}
